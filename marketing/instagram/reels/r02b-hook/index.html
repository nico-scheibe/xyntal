<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Xyntal Reel</title>
<style>
  @font-face { font-family: Archivo; src: url(../_shared/fonts/archivo-latin.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: Plex; src: url(../_shared/fonts/plexsans-latin.woff2) format('woff2'); font-weight: 100 700; }
  @font-face { font-family: JBMono; src: url(../_shared/fonts/font-13.woff2) format('woff2'); font-weight: 400 800; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause</div>
<script type="module" src="film.js"></script>
</body>
</html>
