<main>
  <section class="page-head" id="top">
    <div class="wrap">
      <div class="eyebrow"><b>xyntal</b> / passwort</div>
      <h1>Neues <em>Passwort.</em></h1>
    </div>
  </section>

  <section class="alt page-body">
    <div class="wrap narrow-sm">
      <form id="reset" novalidate>
        <label>Neues Passwort <span class="hint">mindestens 8 Zeichen</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="btn" type="submit">Passwort speichern</button>
        <p class="form-status" id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

<script src="vendor/supabase.js?v=10"></script>
<script src="config.js?v=10"></script>
<script src="app.js?v=10"></script>
<script src="avatars.js?v=10"></script>
<script src="notifications.js?v=10"></script>
<script src="effects.js?v=10"></script>
<script>
  const form = document.getElementById("reset");
  const status = document.getElementById("status");

  // Der Link aus der E-Mail meldet dich automatisch an; ohne gültigen Link geht es hier nicht weiter
  setTimeout(async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      setStatus(status, "Dieser Link ist ungültig oder abgelaufen. Fordere auf der Login-Seite einen neuen an.", "error");
      form.querySelector("button").disabled = true;
    }
  }, 800);

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submitWith(form, status, async (data) => {
      if (data.password.length < 8) throw new Error("Dein Passwort braucht mindestens 8 Zeichen.");
      unwrap(await sb.auth.updateUser({ password: data.password }));
      setStatus(status, "Gespeichert! Du wirst zu deinem Profil weitergeleitet …", "ok");
      setTimeout(() => (location.href = "profil"), 1200);
    });
  });
</script>
</body>
