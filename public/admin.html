<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Xyntal</title>
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Xyntal">
  <meta property="og:image" content="https://xyntal.de/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Xyntal: Große Ideen beginnen mit den richtigen Menschen.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050607'/%3E%3Cpath d='M9 9l14 14' stroke='%23E4ECEB' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M23 9l-5.2 5.2M14.2 17.8L9 23' stroke='%232DE2CE' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css?v=26">
  <link rel="stylesheet" href="style.css?v=26">
  <link rel="stylesheet" href="cosmos.css?v=26">
  <script src="cosmos.js?v=26" defer></script>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="./" aria-label="Xyntal Startseite"><svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14" class="bm-a"/><path d="M19 5l-5.3 5.3M10.3 13.7L5 19" class="bm-b"/></svg>xyntal</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menü</button>
    <nav class="nav-links" id="main-nav" aria-label="Hauptnavigation">
      <a class="hide-sm" href="projekte">Projekte</a>
      <a class="hide-sm" href="community">Community</a>
      <a class="hide-sm" href="boerse">Börse</a>
      <a class="hide-sm" href="mitglieder">Mitglieder</a>
      <a class="hide-sm" href="nachrichten" data-messages hidden>Nachrichten</a>
      <a class="hide-sm" href="login" data-account>Login</a>
      <a class="btn btn-small" href="mitglied-werden">Projekt starten</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-head" id="top" style="padding-bottom: 40px">
    <div class="wrap">
      <div class="eyebrow"><b>xyntal</b> / admin</div>
      <h1>Admin-<em>Bereich.</em></h1>
    </div>
  </section>

  <section class="page-body" style="padding-top: 24px">
    <!-- Kein Zugriff -->
    <div class="wrap narrow-sm" id="login-view" hidden>
      <div class="notice" id="login-msg">Bitte melde dich mit deinem Admin-Konto an.</div>
      <a class="btn" href="login">Zum Login</a>
    </div>

    <!-- Verwaltung -->
    <div class="wrap" id="admin-view" hidden>
      <div class="admin-tabs" role="tablist">
        <button role="tab" data-tab="members" aria-selected="true">Mitglieder <span id="c-members"></span></button>
        <button role="tab" data-tab="signups" aria-selected="false">Frühere Anmeldungen <span id="c-signups"></span></button>
        <button role="tab" data-tab="newsletter" aria-selected="false">Newsletter <span id="c-newsletter"></span></button>
        <button role="tab" data-tab="event" aria-selected="false">Treffen</button>
        <button id="admin-logout" style="margin-left: auto">Ausloggen</button>
      </div>

      <div data-panel="members"></div>
      <div data-panel="signups" hidden></div>
      <div data-panel="newsletter" hidden></div>
      <div data-panel="event" hidden>
        <div class="notice">Mehrere Treffen und ihre Zusagen verwaltest du jetzt auf der Treffen-Seite.</div>
        <a class="btn" href="events?verwalten=1">Treffen verwalten</a>
      </div>
    </div>
  </section>
</main>

<script src="vendor/supabase.js?v=26"></script>
<script src="config.js?v=26"></script>
<script src="app.js?v=26"></script>
<script src="avatars.js?v=26"></script>
<script src="notifications.js?v=26"></script>
<script src="effects.js?v=26"></script>
<script>
  const loginView = document.getElementById("login-view");
  const adminView = document.getElementById("admin-view");
  let lastData = null;
  const PROVIDER_LABELS = { google: "Google", apple: "Apple", linkedin_oidc: "LinkedIn", phone: "Handynummer" };
  const fmt = (ts) => new Date(ts).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
  const statusLabel = { pending: "Wartet", approved: "Freigeschaltet", rejected: "Abgelehnt" };

  async function load() {
    const me = await currentMember();
    if (!me || !me.is_admin) {
      document.getElementById("login-msg").textContent = me
        ? "Dein Konto hat keine Admin-Rechte."
        : "Bitte melde dich mit deinem Admin-Konto an.";
      loginView.hidden = false;
      adminView.hidden = true;
      return;
    }
    let data;
    try {
      const [members, signups, newsletter] = await Promise.all([
        sb.rpc("admin_members").then(unwrap),
        sb.from("event_signups").select("*").order("created_at", { ascending: false }).then(unwrap),
        sb.from("newsletter").select("*").order("created_at", { ascending: false }).then(unwrap),
      ]);
      data = { members, signups, newsletter };
      lastData = data;
    } catch (err) {
      document.querySelector('[data-panel="members"]').innerHTML = `<p class="empty">${esc(err.message)}</p>`;
      loginView.hidden = true;
      adminView.hidden = false;
      return;
    }
    loginView.hidden = true;
    adminView.hidden = false;

    const pending = data.members.filter((m) => m.status === "pending").length;
    document.getElementById("c-members").textContent = `(${data.members.length}${pending ? `, ${pending} neu` : ""})`;
    document.getElementById("c-signups").textContent = `(${data.signups.length})`;
    document.getElementById("c-newsletter").textContent = `(${data.newsletter.length})`;

    document.querySelector('[data-panel="members"]').innerHTML = data.members.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Vorhaben</th><th>Status</th><th>Aktionen</th></tr></thead>
        <tbody>${data.members.map((m) => `
          <tr>
            <td>${esc(m.name || "(noch kein Name)")}<br><small>${esc(m.email || m.phone || "")}${m.provider && m.provider !== "email" ? ` · via ${esc(PROVIDER_LABELS[m.provider] || m.provider)}` : ""}</small><br><small>${fmt(m.created_at)}${m.is_public ? " · öffentlich" : ""}</small></td>
            <td>${esc(m.headline)}<br><small>${esc([PHASES[m.phase], m.category].filter(Boolean).join(" · "))}</small></td>
            <td><span class="status-pill status-${m.status}">${statusLabel[m.status]}</span></td>
            <td><div class="row-actions">
              ${m.status !== "approved" ? `<button data-act="approve" data-id="${m.id}">Freischalten</button>` : ""}
              ${m.status !== "rejected" && !m.is_admin ? `<button data-act="reject" data-id="${m.id}">Ablehnen</button>` : ""}
              ${m.is_admin ? "" : `<button data-act="delete" data-id="${m.id}">Löschen</button>`}
            </div></td>
          </tr>`).join("")}
        </tbody></table></div>` : `<p class="empty">Noch keine Mitglieder.</p>`;

    document.querySelector('[data-panel="signups"]').innerHTML = `
      <p class="hint">Archiv der früheren Anmeldung ohne festen Termin. Neue Zusagen stehen beim jeweiligen Treffen.</p><p><a class="text-link" href="#" data-csv="signups">Als CSV herunterladen</a></p>
      ${data.signups.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Woran arbeitest du?</th><th>Angemeldet</th></tr></thead>
        <tbody>${data.signups.map((s) => `
          <tr><td>${esc(s.name)}<br><small>${esc(s.email)}</small></td><td>${esc(s.project)}</td><td><small>${fmt(s.created_at)}</small></td></tr>`).join("")}
        </tbody></table></div>` : `<p class="empty">Noch keine Anmeldungen.</p>`}`;

    document.querySelector('[data-panel="newsletter"]').innerHTML = `
      <p class="hint">Neue Newsletter-Anmeldungen werden nach E-Mail-Bestätigung direkt in Brevo verwaltet. Diese Ansicht enthält nur frühere, lokale Einträge.</p>
      <p><a class="text-link" href="https://app.brevo.com/contact/forms-app/subscription" target="_blank" rel="noopener">Bestätigte Abonnenten in Brevo verwalten</a></p>
      ${data.newsletter.length ? `<details><summary>Frühere lokale Einträge (${data.newsletter.length})</summary><p><a class="text-link" href="#" data-csv="newsletter">Als CSV herunterladen</a></p><div class="table-wrap"><table>
        <thead><tr><th>E-Mail</th><th>Eingetragen</th></tr></thead>
        <tbody>${data.newsletter.map((n) => `<tr><td>${esc(n.email)}</td><td><small>${fmt(n.created_at)}</small></td></tr>`).join("")}
        </tbody></table></div></details>` : `<p class="empty">Keine früheren lokalen Einträge.</p>`}`;


  }

  // Tabs
  document.querySelectorAll("[data-tab]").forEach((btn) => btn.addEventListener("click", () => {
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b === btn));
    document.querySelectorAll("[data-panel]").forEach((p) => { p.hidden = p.dataset.panel !== btn.dataset.tab; });
  }));

  // Mitglieder-Aktionen
  document.querySelector('[data-panel="members"]').addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const { act, id } = btn.dataset;
    try {
      if (act === "delete") {
        // Zweistufig statt Browser-Dialog
        if (!btn.dataset.armed) {
          btn.dataset.armed = "1";
          btn.textContent = "Sicher? Nochmal klicken";
          return;
        }
        await deleteMemberAvatars(id);
        unwrap(await sb.rpc("admin_delete_member", { p_id: id }));
      } else {
        unwrap(await sb.rpc("admin_set_status", { p_id: id, p_status: act === "approve" ? "approved" : "rejected" }));
      }
    } catch (err) {
      alertBox(err.message);
    }
    load();
  });

  document.getElementById("admin-logout").addEventListener("click", async () => {
    await sb.auth.signOut();
    location.href = "./";
  });

  function alertBox(text) {
    const panel = document.querySelector('[data-panel="members"]');
    panel.insertAdjacentHTML("afterbegin", `<div class="notice">${esc(text)}</div>`);
  }

  function downloadCsv(filename, header, rows) {
    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = "\ufeff" + [header, ...rows].map((r) => r.map(cell).join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  adminView.addEventListener("click", (e) => {
    const link = e.target.closest("[data-csv]");
    if (!link || !lastData) return;
    e.preventDefault();
    if (link.dataset.csv === "signups") {
      downloadCsv("xyntal-anmeldungen.csv", ["Name", "E-Mail", "Projekt", "Angemeldet"],
        lastData.signups.map((s) => [s.name, s.email, s.project, fmt(s.created_at)]));
    } else {
      downloadCsv("xyntal-newsletter.csv", ["E-Mail", "Eingetragen"],
        lastData.newsletter.map((n) => [n.email, fmt(n.created_at)]));
    }
  });

  load();
</script>
</body>
</html>
