  <style>
    .admin-summary { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; margin-bottom: 16px; }
    .admin-summary article { display: grid; gap: 7px; padding: 24px; border: 1px solid var(--border); border-radius: 2px; background: #101013; }
    .admin-summary b { font-size: 38px; line-height: 1.1; color: var(--text); }
    .admin-summary small { color: var(--text-2); }
    @media(max-width:600px) { .admin-summary { grid-template-columns: 1fr; } }

    .card-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .card-filters button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: rgba(0, 0, 0, 0.05); color: var(--text-2); cursor: pointer; font: 500 13px/1 var(--f-text); }
    .card-filters button[aria-pressed="true"] { background: #242424; color: #000; }
    .skill-tag { display: inline-block; margin: 0 4px 4px 0; padding: 3px 9px; border-radius: 999px; background: rgba(0, 0, 0, 0.08); font-size: 12px; }
    .card-note { width: 100%; min-width: 160px; margin-top: 8px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0, 0, 0, 0.04); color: var(--text); font: 13px/1.4 var(--f-text); resize: vertical; }
    .card-note.is-saved { border-color: #34D399; }
  </style>

<main class="xa-page">
  <!-- Kein Zugriff -->
  <div class="xa-login" id="login-view" hidden>
    <h1>Admin</h1>
    <div class="notice" id="login-msg">Bitte melde dich mit deinem Admin-Konto an.</div>
    <a class="btn" href="login?next=admin">Zum Login</a>
  </div>

  <!-- Verwaltung: links eine Liste in 4 Gruppen wie im Admin-Bereich der App (SectionSidebar.qml) -->
  <div class="xa-shell" id="admin-view" hidden>
    <aside class="xa-side">
      <p class="xa-side-title">Admin <span class="admin-role-badge" id="admin-role" hidden></span></p>
      <nav class="admin-tabs xa-nav" role="tablist" aria-label="Admin-Bereiche" aria-orientation="vertical">
        <p class="xa-group" data-group-title="daily">Täglich</p>
        <button role="tab" data-tab="start" data-group="daily" aria-selected="false"><i class="xa-ico" data-ico="home"></i><span>Aufgaben &amp; Überblick</span> <em id="c-start"></em></button>
        <button role="tab" data-tab="people" data-group="daily" aria-selected="false"><i class="xa-ico" data-ico="users"></i><span>Nutzer</span> <em id="c-people"></em></button>
        <button role="tab" data-tab="support" data-group="daily" data-platform data-perm="tickets.handle" aria-selected="false"><i class="xa-ico" data-ico="help"></i><span>Support</span> <em id="c-support"></em></button>
        <button role="tab" data-tab="reports" data-group="daily" data-platform data-perm="reports.handle" aria-selected="false"><i class="xa-ico" data-ico="flag"></i><span>Meldungen</span> <em id="c-reports"></em></button>
        <p class="xa-group" data-group-title="content">Inhalte</p>
        <button role="tab" data-tab="cards" data-group="content" data-site aria-selected="false"><i class="xa-ico" data-ico="card"></i><span>Karten</span> <em id="c-cards"></em></button>
        <button role="tab" data-tab="projects" data-group="content" data-platform data-perm="oversight.view" aria-selected="false"><i class="xa-ico" data-ico="kanban"></i><span>Projekte</span> <em id="c-projects"></em></button>
        <button role="tab" data-tab="workspaces" data-group="content" data-platform data-perm="oversight.view" aria-selected="false"><i class="xa-ico" data-ico="grid"></i><span>Arbeitsbereiche</span> <em id="c-workspaces"></em></button>
        <button role="tab" data-tab="announcements" data-group="content" data-platform data-perm="announcements.manage" aria-selected="false"><i class="xa-ico" data-ico="megaphone"></i><span>Ankündigungen</span> <em id="c-announcements"></em></button>
        <button role="tab" data-tab="contracts" data-group="content" data-site aria-selected="false"><i class="xa-ico" data-ico="file"></i><span>Firmenverträge</span></button>
        <button role="tab" data-tab="vouchers" data-group="content" data-platform data-perm="billing.manage" aria-selected="false"><i class="xa-ico" data-ico="ticket"></i><span>Gutscheine</span> <em id="c-vouchers"></em></button>
        <button role="tab" data-tab="partners" data-group="content" data-platform data-perm="users.view" aria-selected="false"><i class="xa-ico" data-ico="activity"></i><span>Partner</span></button>
        <p class="xa-group" data-group-title="insights">Auswertung</p>
        <button role="tab" data-tab="platform" data-group="insights" data-platform aria-selected="false"><i class="xa-ico" data-ico="gauge"></i><span>Plattform-Zahlen</span></button>
        <button role="tab" data-tab="feedback" data-group="insights" data-platform data-perm="users.view" aria-selected="false"><i class="xa-ico" data-ico="activity"></i><span>Feedback &amp; Herkunft</span> <em id="c-feedback"></em></button>
        <button role="tab" data-tab="ai" data-group="insights" data-platform data-perm="ai.view" aria-selected="false"><i class="xa-ico" data-ico="sparkles"></i><span>KI</span></button>
        <button role="tab" data-tab="matching" data-group="insights" data-platform data-perm="oversight.view" aria-selected="false"><i class="xa-ico" data-ico="target"></i><span>Matching</span></button>
        <button role="tab" data-tab="health" data-group="insights" data-platform aria-selected="false"><i class="xa-ico" data-ico="activity"></i><span>Systemzustand</span></button>
        <p class="xa-group" data-group-title="system">Sicherheit &amp; System</p>
        <button role="tab" data-tab="security" data-group="system" data-platform data-perm="security.view" aria-selected="false"><i class="xa-ico" data-ico="alert"></i><span>Sicherheit</span></button>
        <button role="tab" data-tab="access" data-group="system" data-platform data-perm="audit.view" aria-selected="false"><i class="xa-ico" data-ico="eye"></i><span>Nachrichtenzugriff</span></button>
        <button role="tab" data-tab="audit" data-group="system" data-platform data-perm="audit.view" aria-selected="false"><i class="xa-ico" data-ico="file"></i><span>Audit-Log</span></button>
        <button role="tab" data-tab="console" data-group="system" data-platform data-perm="users.view" aria-selected="false"><i class="xa-ico" data-ico="terminal"></i><span>Konsole</span></button>
        <button role="tab" data-tab="newsletter" data-group="system" data-site aria-selected="false"><i class="xa-ico" data-ico="mail"></i><span>Newsletter &amp; Brevo</span> <em id="c-newsletter"></em></button>
        <button role="tab" data-tab="signups" data-group="system" data-site aria-selected="false"><i class="xa-ico" data-ico="archive"></i><span>Archiv: Anmeldungen</span> <em id="c-signups"></em></button>
      </nav>
      <button type="button" id="admin-logout">Ausloggen</button>
    </aside>

    <div class="xa-main">
      <!-- Start und Nutzer (admin-people.js): eine Liste für App-Konten, Website-Konten und Beta-Bewerbungen -->
      <div data-panel="start" data-no-i18n><p class="xa-loading">Wird geladen …</p></div>
      <div data-panel="people" data-no-i18n hidden></div>

      <!-- Plattform: dieselben Bereiche wie der Admin-Bereich der Xyntal-App, über den App-Server (api.xyntal.de).
           Servertexte (Namen, Gründe, Protokolle) werden nicht übersetzt. -->
      <div data-panel="platform" data-no-i18n hidden></div>
      <div data-panel="console" data-no-i18n hidden></div>
      <div data-panel="projects" data-no-i18n hidden></div>
      <div data-panel="workspaces" data-no-i18n hidden></div>
      <div data-panel="support" data-no-i18n hidden></div>
      <div data-panel="reports" data-no-i18n hidden></div>
      <div data-panel="access" data-no-i18n hidden></div>
      <div data-panel="security" data-no-i18n hidden></div>
      <div data-panel="ai" data-no-i18n hidden></div>
      <div data-panel="matching" data-no-i18n hidden></div>
      <div data-panel="health" data-no-i18n hidden></div>
      <div data-panel="announcements" data-no-i18n hidden></div>
      <div data-panel="vouchers" data-no-i18n hidden></div>
      <div data-panel="partners" data-no-i18n hidden></div>
      <div data-panel="feedback" data-no-i18n hidden></div>
      <div data-panel="audit" data-no-i18n hidden></div>

      <!-- Website: Karten, Archiv, Newsletter (Supabase) -->
      <div data-panel="cards" hidden></div>
      <div data-panel="signups" hidden></div>
      <div data-panel="newsletter" hidden></div>

      <!-- Firmenverträge (Tabelle business_contracts, nur Website-Admins); Vertragstext bleibt deutsch -->
      <div data-panel="contracts" data-no-i18n hidden></div>
    </div>
  </div>
