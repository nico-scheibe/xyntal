<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Seite gestalten – Xyntal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css?v=32">
  <link rel="stylesheet" href="/home.css?v=37">
</head>
<body>
<main class="shell" style="padding:96px 0;text-align:center">
  <p data-msg style="color:var(--text-2)">Deine Seite wird geöffnet …</p>
</main>
<script src="/vendor/supabase.js?v=31"></script>
<script src="/config.js?v=31"></script>
<script>
// Die Seite wird direkt unter xyntal.de/deinname gestaltet (u.js, Adresse mit #gestalten): hierher führen nur ältere Links
(async () => {
  const msg = document.querySelector("[data-msg]"), c = window.XYNTAL_CONFIG;
  try {
    const sb = window.supabase.createClient(c.supabaseUrl, c.supabaseKey);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { msg.innerHTML = 'Melde dich an, um deine Seite zu gestalten. <a class="text-link" href="/login">Anmelden</a>'; return; }
    const { data } = await sb.rpc("get_my_card");
    if (data && data.handle) { location.replace(`/${data.handle}#gestalten`); return; }
    msg.innerHTML = 'Lege zuerst deine Karte an. <a class="text-link" href="/meine-karte">Zur Karte</a>';
  } catch { msg.textContent = "Das hat gerade nicht geklappt. Bitte versuch es gleich noch einmal."; }
})();
</script>
</body>
</html>
