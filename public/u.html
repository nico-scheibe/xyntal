<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#07070B">
  <meta name="robots" content="noindex">
  <title>Xyntal-Karte</title>
  <meta name="description" content="Eine Karte auf Xyntal – der Plattform, auf der aus Ideen Teams werden.">
  <meta property="og:title" content="Xyntal-Karte">
  <meta property="og:description" content="Stop swiping. Start building. – Finde Leute für deine Idee auf xyntal.de">
  <meta property="og:image" content="https://xyntal.de/og-image.jpg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/fonts/fonts.css?v=31">
  <link rel="stylesheet" href="/home.css?v=9">
  <script src="/i18n-en.js?v=50" defer></script>
  <script src="/i18n.js?v=31" defer></script>
  <style>
    .profile { min-height: calc(100vh - 200px); display: grid; align-content: center; justify-items: center; gap: 22px; padding: 48px 0 72px; text-align: center; }
    .profile .bp-stage { max-width: 440px; }
    .profile .my-card { transform: none; }
    .profile-msg { display: grid; gap: 12px; justify-items: center; max-width: 30rem; }
    .profile-msg h1 { font: 700 clamp(28px, 5vw, 40px)/1.1 var(--f); letter-spacing: -0.03em; }
    .profile-msg h1 b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .profile-msg p { color: var(--text-2); }
    .profile-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .profile-loading { color: var(--text-3); }
    @media (max-width: 480px) { .profile-actions .btn { width: 100%; } }
    .pp { display: grid; gap: 18px; width: min(100%, 560px); padding: clamp(20px, 4vw, 28px); border-radius: 24px; text-align: left; }
    .pp-headline { font: 600 19px/1.4 var(--f); letter-spacing: -0.01em; }
    .pp-block h2 { margin-bottom: 6px; font: 600 12.5px/1 var(--f-text); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
    .pp-block p { color: var(--text-2); white-space: pre-line; overflow-wrap: anywhere; }
    .pp-links { display: flex; flex-wrap: wrap; gap: 8px; }

.public-activity { width: 100%; max-width: 760px; display: grid; gap: 28px; text-align: left; }
.public-section { display: grid; gap: 12px; }
.public-section h2 { font-size: 24px; letter-spacing: -.03em; }
.public-item { display: grid; gap: 9px; padding: 22px; border-radius: 20px; text-decoration: none; overflow-wrap: anywhere; }
.public-item:hover { border-color: var(--c); }
.public-item:focus-visible { outline: 2px solid var(--c); outline-offset: 4px; }
.public-item h3 { font-size: 20px; }
.public-item p, .public-empty { color: var(--text-2); }
.public-item-meta { font-size: 12px; color: var(--text-2); }
.public-item-link { font-size: 14px; color: var(--c); }

.profile { padding-inline: max(var(--gutter), env(safe-area-inset-left)); grid-template-columns: minmax(0, 1fr); }
.profile > *, .public-section, .public-item, .profile-msg { min-width: 0; max-width: 100%; }
.profile-msg { width: min(100%, 30rem); }
.profile-msg p { overflow-wrap: anywhere; }
.public-item p { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="home">
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="/" aria-label="Xyntal – Startseite">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="bm-g" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B95CFF"/><stop offset=".45" stop-color="#FF5FD2"/><stop offset="1" stop-color="#3FD8FF"/></linearGradient></defs><path d="M5 5l14 14M19 5l-5.3 5.3M10.3 13.7L5 19" stroke="url(#bm-g)"/></svg>
      <span>xyntal</span>
    </a>
    <nav class="mainnav" aria-label="Hauptnavigation" style="display:flex">
      <a class="btn btn-primary btn-sm" href="/#warteliste">Auf die Warteliste</a>
    </nav>
  </div>
</header>
<main class="shell profile" id="inhalt" data-profile aria-live="polite">
  <p class="profile-loading">Karte wird geladen …</p>
</main>
<footer class="footer">
  <div class="shell footer-inner">
    <nav class="footer-nav" aria-label="Rechtliches">
      <a href="/impressum">Impressum</a>
      <a href="/impressum#datenschutz">Datenschutz</a>
    </nav>
  </div>
</footer>
<script src="/u.js?v=3" defer></script>
</body>
</html>
